# ★ 배포 승인용 컬렉션: 새 모델/버전을 운영에 올리기 전 한 번의 요청으로 통과 여부를 판단한다.
#   가중 평균(골든셋 3 : KMMLU 과목별 1)이 threshold 이상이면 통과. 데이터 위치(test_data_ref)까지 포함한다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: evalhub-collection-kbl-release-v1
  namespace: redhat-ods-applications
  labels:
    trustyai.opendatahub.io/evalhub-collection-type: system
    trustyai.opendatahub.io/evalhub-collection-name: kbl-release-v1
data:
  kbl-release-v1.yaml: |
    id: kbl-release-v1
    name: KB Life 배포 승인 v1
    category: release-gate
    description: KB Life 골든셋(업무 정확성) + KMMLU 보험 연관 과목(한국어 전문지식)
    tags: [kbl, release-gate, korean]
    pass_criteria:
      threshold: 0.5
    benchmarks:
      - id: kbl_insurance_qa
        provider_id: kbl_golden
        weight: 3
        primary_score: {metric: golden_score, lower_is_better: false}
        pass_criteria: {threshold: 0.6}
        parameters: {dataset_version: v1}
        test_data_ref:
          s3: {bucket: kbl-eval, key: golden/v1, secret_ref: kbl-eval-s3}
      - id: kmmlu_direct_accounting
        provider_id: kbl_lm_eval_ko
        weight: 1
        primary_score: {metric: exact_match, lower_is_better: false}
        pass_criteria: {threshold: 0.35}
        parameters: {tokenizer: /test_data/tokenizer, num_concurrent: 2}
        test_data_ref:
          s3: {bucket: kbl-eval, key: datasets/kmmlu-kbl, secret_ref: kbl-eval-s3}
      - id: kmmlu_direct_economics
        provider_id: kbl_lm_eval_ko
        weight: 1
        primary_score: {metric: exact_match, lower_is_better: false}
        pass_criteria: {threshold: 0.35}
        parameters: {tokenizer: /test_data/tokenizer, num_concurrent: 2}
        test_data_ref:
          s3: {bucket: kbl-eval, key: datasets/kmmlu-kbl, secret_ref: kbl-eval-s3}
      - id: kmmlu_direct_taxation
        provider_id: kbl_lm_eval_ko
        weight: 1
        primary_score: {metric: exact_match, lower_is_better: false}
        pass_criteria: {threshold: 0.35}
        parameters: {tokenizer: /test_data/tokenizer, num_concurrent: 2}
        test_data_ref:
          s3: {bucket: kbl-eval, key: datasets/kmmlu-kbl, secret_ref: kbl-eval-s3}
      - id: kmmlu_direct_law
        provider_id: kbl_lm_eval_ko
        weight: 1
        primary_score: {metric: exact_match, lower_is_better: false}
        pass_criteria: {threshold: 0.35}
        parameters: {tokenizer: /test_data/tokenizer, num_concurrent: 2}
        test_data_ref:
          s3: {bucket: kbl-eval, key: datasets/kmmlu-kbl, secret_ref: kbl-eval-s3}
