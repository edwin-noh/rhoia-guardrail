# EvalHub 서버. 대시보드 Evaluations 화면이 찾을 수 있도록 redhat-ods-applications 에 둔다
# (RHOAI 3.5 알려진 이슈 RHOAIENG-66068: 다른 네임스페이스의 인스턴스는 대시보드에서 보이지 않음)
apiVersion: trustyai.opendatahub.io/v1
kind: EvalHub
metadata:
  name: evalhub
  namespace: redhat-ods-applications
spec:
  replicas: 1
  database:
    type: postgresql
    secret: evalhub-db-credentials        # db-url 키 (SealedSecret)
  providers:
    - lm-evaluation-harness               # 시스템 제공
    - kbl-lm-eval-ko                      # ★ 커스텀: lm-eval + KMMLU (provider-lm-eval-ko.yaml)
    - kbl-golden                          # ★ 커스텀: KB Life 골든셋 adapter (provider-kbl-golden.yaml)
  # 배포 승인용 컬렉션(kbl-release-v1)은 test_data_ref(S3) 를 포함하므로 REST API 로 테넌트에 등록한다
  # (jobs/create-collection.sh). ConfigMap(system collection) 로더는 test_data_ref.s3.secret_ref 를
  # 인식하지 못해 서버가 기동 실패한다 (RHOAI 3.5 에서 확인).
  # MLflow 연동(MLFLOW_TRACKING_URI / WORKSPACE / CA / 토큰)은 operator 가 같은 네임스페이스의 MLflow 를 찾아 자동 설정한다.
  # 직접 지정할 때는 RHOAI MLflow 의 --static-prefix(/mlflow) 를 포함해야 한다:
  #   https://mlflow.redhat-ods-applications.svc:8443/mlflow
  # (prefix 가 빠지면 workspace 지원 감지가 실패해 job 제출 시 "Workspace context is required" 오류)
