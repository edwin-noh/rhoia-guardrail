# EvalHub 결과 저장용 PostgreSQL (샘플용 단일 인스턴스). 운영은 사내 표준 DB/Operator 사용 권장
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: evalhub-postgres
  namespace: kbl-eval
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: evalhub-postgres
  namespace: kbl-eval
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: evalhub-postgres
  template:
    metadata:
      labels:
        app: evalhub-postgres
    spec:
      containers:
        - name: postgres
          image: registry.redhat.io/rhel9/postgresql-16:latest
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: evalhub-postgres   # POSTGRESQL_USER / PASSWORD / DATABASE (SealedSecret)
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          readinessProbe:
            exec:
              command: ["/usr/libexec/check-container"]
            initialDelaySeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: evalhub-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: evalhub-postgres
  namespace: kbl-eval
spec:
  selector:
    app: evalhub-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
# EvalHub 서버(redhat-ods-applications)에서 DB 로의 접속만 허용
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: evalhub-postgres
  namespace: kbl-eval
spec:
  podSelector:
    matchLabels:
      app: evalhub-postgres
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: redhat-ods-applications
      ports:
        - port: 5432
