apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - serviceaccount.yaml
  - sa-token-secret.yaml
  - rolebinding-view.yaml
  - ca-bundle-configmap.yaml
  - nemoguardrails.yaml

# CR 이 ConfigMap 이름을 직접 참조하므로 hash suffix 를 붙이지 않는다
generatorOptions:
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/part-of: kbl-nemo-guardrails

# 정책(엔드포인트와 무관). 모델 엔드포인트는 overlay 의 nemo-models 에서 정의한다
configMapGenerator:
  - name: nemo-rails-pii-regex
    files:
      - rails/pii-regex/config.yaml
      - rails/pii-regex/rails.co
  - name: nemo-rails-self-check
    files:
      - rails/self-check/config.yaml
      - rails/shared/prompts.yml
      - rails/self-check/rails.co
  - name: nemo-rails-combined
    files:
      - rails/combined/config.yaml
      - rails/shared/prompts.yml
      - rails/combined/rails.co
