# NeMo Guardrails 서버. operator 가 같은 이름의 Deployment / Service / Route 를 만든다.
# 각 config 는 ConfigMap 하나(nemo-rails-*)를 /app/config/<name>/ 에 마운트한다.
# 이 ConfigMap 에는 정책(config.yaml 등)과 overlay 가 넣어 주는 models.yaml 이 함께 들어 있고,
# NeMo 가 디렉터리의 yaml 을 병합해 읽는다.
# (주의: 한 config 에 ConfigMap 을 여러 개 지정하면 operator 가 같은 경로에 중복 마운트해 Deployment 생성이 실패한다)
apiVersion: trustyai.opendatahub.io/v1alpha1
kind: NemoGuardrails
metadata:
  name: kbl-nemo-guardrails
  annotations:
    # 호출자는 이 네임스페이스 서비스 view 권한이 있는 토큰이 필요하다
    security.opendatahub.io/enable-auth: 'true'
spec:
  replicas: 1
  nemoConfigs:
    - name: combined          # ③ PII 탐지 + self-check (기본)
      default: true
      configMaps:
        - nemo-rails-combined
    - name: pii-regex         # ① Presidio + 한국 PII regex (LLM 호출 없음)
      configMaps:
        - nemo-rails-pii-regex
    - name: self-check        # ② LLM 판정(의도 탐지)
      configMaps:
        - nemo-rails-self-check
  env:
    # models.yaml 의 api_key_env_var 와 이름을 맞춘다
    - name: MAIN_MODEL_API_KEY
      valueFrom:
        secretKeyRef:
          name: nemo-guardrails-sa-token
          key: token
    - name: GUARD_MODEL_API_KEY       # 판정 모델이 다른 곳이면 overlay 에서 Secret 이름만 patch
      valueFrom:
        secretKeyRef:
          name: nemo-guardrails-sa-token
          key: token
  # predictor(8443) TLS 는 operator 가 OpenShift service CA 를 자동으로 신뢰하므로 caBundleConfig 불필요
