# ① Presidio + 한국 PII 정규식. LLM 호출 없이 NeMo pod 안에서만 동작한다.
# 모델 정의(models)는 overlay 가 같은 ConfigMap 에 넣어 주는 models.yaml 에서 병합된다.
rails:
  config:
    sensitive_data_detection:
      input:
        entities:
          - EMAIL_ADDRESS
          - PHONE_NUMBER
          - CREDIT_CARD
          - IP_ADDRESS
          - PERSON          # 영어 NER 기반이라 한국어 이름은 거의 탐지하지 못한다
      output:
        entities:
          - EMAIL_ADDRESS
          - PHONE_NUMBER
          - CREDIT_CARD
          - IP_ADDRESS
    regex_detection:
      input:
        patterns: &kr_pii
          # 주민등록번호 / 외국인등록번호 (YYMMDD-[1-8]XXXXXX)
          - '(?<!\d)\d{2}(0[1-9]|1[0-2])(0[1-9]|[12]\d|3[01])-?[1-8]\d{6}(?!\d)'
          # 휴대폰 번호
          - '(?<!\d)01[016789][- .]?\d{3,4}[- .]?\d{4}(?!\d)'
          # 계좌번호 형태 (숫자-숫자-숫자, 총 10자리 이상)
          - '(?<!\d)(?=(?:\d-?){10,})\d{3,6}-\d{2,6}-\d{2,7}(?!\d)'
          # 민감정보 키워드 (한글은 \b 가 동작하지 않으므로 사용하지 않는다)
          - '주민\s*(등록)?\s*번호|외국인\s*등록\s*번호|여권\s*번호|비밀\s*번호|계좌\s*비밀번호'
          - '\b(password|passwd|secret|api[_-]?key)\b'
        case_insensitive: true
      output:
        patterns: *kr_pii
        case_insensitive: true
  input:
    flows:
      - regex check input
      - detect sensitive data on input
  output:
    flows:
      - regex check output
      - detect sensitive data on output
