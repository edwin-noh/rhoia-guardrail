# ② LLM self-check. 판정은 models.yaml 의 self_check_input / self_check_output 모델이 수행한다.
#    (기본값은 서빙 모델과 동일. 한국어 특화 가드 모델로 바꾸려면 overlay 의 models.yaml 만 수정)
# 원래 messages(system 포함)를 그대로 main 모델에 전달한다. 가드레일은 입력/출력 판정만 한다.
# (false 면 NeMo 가 자체 'general' 프롬프트로 대화를 재구성해 system 메시지가 빠진다)
passthrough: true

rails:
  input:
    flows:
      - self check input
  output:
    flows:
      - self check output
