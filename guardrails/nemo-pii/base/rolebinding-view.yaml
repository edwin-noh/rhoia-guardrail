# 모델 predictor 의 kube-rbac-proxy 는 호출자에게 해당 네임스페이스 서비스 조회(view) 권한을 요구한다
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nemo-guardrails-sa-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: nemo-guardrails-sa
