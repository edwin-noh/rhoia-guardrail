# SA 토큰을 Kubernetes가 채워 넣는 Secret. 토큰 값을 Git에 두지 않는다.
# (data.token 은 kube-controller-manager 가 채우므로 Application 에서 ignoreDifferences 처리)
apiVersion: v1
kind: Secret
metadata:
  name: nemo-guardrails-sa-token
  annotations:
    kubernetes.io/service-account.name: nemo-guardrails-sa
type: kubernetes.io/service-account-token
