# ★ 모델 엔드포인트 정의 (환경별 변수 역할). 3개 config(combined / pii-regex / self-check)가 공유한다.
#
# - main              : 실제 답변을 생성하는 서빙 모델 (/v1/chat/completions 호출 시)
# - self_check_input  : 입력 판정 모델
# - self_check_output : 출력 판정 모델
#
# 한국어 특화 가드레일 모델로 교체하려면 self_check_* 두 블록의 model / base_url 만 바꾸고 push 한다.
#   조건: OpenAI 호환 /v1/chat/completions 를 제공하고, 판정 프롬프트에 Yes/No 로 답할 수 있어야 한다.
#   토큰이 다르면 kustomization.yaml 의 GUARD_MODEL_API_KEY patch 로 Secret 을 바꾼다.
#   base_url 은 반드시 /v1 로 끝나야 한다.
#   예) model: <korean-guard-model>
#       base_url: https://<korean-guard-model>-predictor.<namespace>.svc.cluster.local:8443/v1
models:
  - type: main
    engine: openai
    model: qwen3-4b-instruct-2507-v10
    api_key_env_var: MAIN_MODEL_API_KEY
    parameters:
      base_url: https://qwen3-4b-instruct-2507-v10-predictor.model-hub.svc.cluster.local:8443/v1
      temperature: 0.3

  - type: self_check_input
    engine: openai
    model: qwen3-4b-instruct-2507-v10
    api_key_env_var: GUARD_MODEL_API_KEY
    parameters:
      base_url: https://qwen3-4b-instruct-2507-v10-predictor.model-hub.svc.cluster.local:8443/v1
      temperature: 0.0
      max_tokens: 5

  - type: self_check_output
    engine: openai
    model: qwen3-4b-instruct-2507-v10
    api_key_env_var: GUARD_MODEL_API_KEY
    parameters:
      base_url: https://qwen3-4b-instruct-2507-v10-predictor.model-hub.svc.cluster.local:8443/v1
      temperature: 0.0
      max_tokens: 5
