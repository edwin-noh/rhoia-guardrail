# 부하를 줄 대상 모델. run.sh 가 대상 × 시나리오(scenarios.yaml)를 차례로 실행한다.
# 두 대상은 같은 모델(qwen3-1-7b)·같은 vLLM 인자로 배포되어 있어 경로(Gateway·인증) 차이만 비교된다.
#   rhoai-serving-gitops/ai/raw/qwen3-1-7b.yaml , ai/maas/qwen3-1-7b.yaml
#
#   url          : OpenAI 호환 base URL (/v1 까지)
#   model        : 요청 body 의 model 값
#   processor    : 합성 데이터 토큰 수를 셀 tokenizer (Hugging Face id 또는 /test_data/<dir>)
#   auth_secret  : kbl-eval 의 Secret 이름 (setup-targets.sh 가 만든다). job 의 model.auth.secret_ref 로 들어간다.
#                  - ca_cert 키 : sidecar 가 이 CA 로 TLS 를 검증한다
#                  - api-key 키 : 있으면 Bearer 로 보낸다. 없으면 sidecar 가 job SA 토큰을 넣는다(kube-rbac-proxy 용)
#   experiment   : MLflow experiment 이름
#   max_model_len: vLLM --max-model-len. 입력+출력 토큰이 이를 넘는 시나리오는 건너뛴다 (생략하면 검사하지 않음)
#   dashboards   : 리포트에 넣을 모니터링 링크. {from} {to} 는 측정 시작/종료 시각(epoch ms)으로 바뀐다
targets:
  - id: raw
    name: Raw (KServe RawDeployment, kube-rbac-proxy)
    url: https://qwen3-1-7b-predictor.kbl-models.svc.cluster.local:8443/v1
    model: qwen3-1-7b
    processor: Qwen/Qwen3-1.7B
    max_model_len: 4096          # ai/raw/qwen3-1-7b.yaml --max-model-len=4096
    auth_secret: kbl-perf-raw
    experiment: kbl-perf-raw
    dashboards:
      vLLM (kbl-model-serving): "{grafana}/d/kbl-model-serving/?from={from}&to={to}&var-namespace=kbl-models&var-model=qwen3-1-7b"
      GPU (dcgm): "{grafana}/d/Oxed_c6Wz/?from={from}&to={to}"

  - id: maas
    name: MaaS (llm-d, Gateway + Authorino + Limitador)
    url: https://maas.apps.rhoai-35.edwin.home/v1
    model: qwen3-1-7b
    processor: Qwen/Qwen3-1.7B
    max_model_len: 4096          # ai/maas/qwen3-1-7b.yaml --max-model-len=4096
    auth_secret: kbl-perf-maas
    experiment: kbl-perf-maas
    dashboards:
      vLLM (kbl-model-serving): "{grafana}/d/kbl-model-serving/?from={from}&to={to}&var-namespace=kbl-maas&var-model=qwen3-1-7b"
      MaaS 사용량 (kbl-maas-usage): "{grafana}/d/kbl-maas-usage/?from={from}&to={to}&var-subscription=kbl-perf-testers"
      GPU (dcgm): "{grafana}/d/Oxed_c6Wz/?from={from}&to={to}"
